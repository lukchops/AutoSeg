# Dense, fused, noisy: shorter runs with more peaks, heavy composites, low SNR, frequent steps/artifacts.

fs: 10
length_min: [5, 15]
peak_count: [2, 10]
boundary_frac: 0.01
real_templates: templates/real_templates.npz

peaks:
  height_mau: [0.5, 1500]
  min_snr: 3
  min_visibility: 0.3
  fwhm_s: [0.8, 20]
  edge_margin_s: 5
  negative_prob: 0.08
  asym_sigma: 0.3
  shape_noise: 0.08

families:
  gaussian:   {weight: 1}
  emg_tail:   {weight: 3, tau_ratio: [0.5, 5]}
  emg_front:  {weight: 1, tau_ratio: [0.3, 2]}
  bigaussian: {weight: 1, ratio: [1.5, 4]}
  lorentzian: {weight: 1, eta: [0.3, 1]}
  flat_top:   {weight: 0.5, power: [1.5, 6]}
  broad_hump: {weight: 0.7, ratio: [1, 3], fwhm_s: [20, 150]}
  narrow:     {weight: 1, fwhm_s: [0.4, 1]}
  shoulder:   {weight: 1.5, rs: [0.55, 0.8], height_ratio: [0.1, 0.5], sub_families: [gaussian, emg_tail, bigaussian, lorentzian]}
  doublet:    {weight: 1.5, rs: [0.5, 1.0], height_ratio: [0.3, 1], sub_families: [gaussian, emg_tail, bigaussian, lorentzian]}
  real:       {weight: 2}

background:
  offset_mau: [-5, 5]
  drift_mau: [-40, 40]
  curve_mau: [0, 20]
  wander_mau: [0, 5]
  wander_scale_s: [10, 200]
  steps: {count: [0, 3], mau: [1, 20], rise_s: [0.3, 5]}
  noise_mau: [0.3, 3]
  lf_noise_ratio: [0.5, 2]
  lf_noise_scale_s: [0.5, 5]

artifacts:
  spikes:   {prob: 0.6, count: [1, 6], mau: [5, 200], width_samples: [1, 3]}
  dropouts: {prob: 0.3, count: [1, 2], duration_s: [0.5, 10]}
  clipping: {prob: 0.3, frac: [0.4, 0.9]}
